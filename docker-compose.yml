version: "3"

services:
  game:
    build: .
    volumes:
      - ./Server/lib:/app/Server/lib/
      - kkutu_data:/kkutu
    environment:
      SQLITE_PATH: /kkutu/kkutu.db
    command: [ "node", "/app/Server/lib/Game/cluster.js", "0", "1" ]
    restart: always
    ports:
      - 8496:8496
      - 8080:8080
  web:
    build: .
    volumes:
      - ./Server/lib:/app/Server/lib/
      - kkutu_data:/kkutu
    environment:
      SQLITE_PATH: /kkutu/kkutu.db
    command: [ "node", "/app/Server/lib/Web/cluster.js", "1" ]
    restart: always
    depends_on:
      - game
    ports:
      - 80:80
volumes:
  kkutu_data: