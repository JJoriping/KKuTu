name: Deploy to Render

on:
  push:
    branches: [main, master, claude/vercel-hosting-setup-fhVYR]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get owner ID and existing services
        id: info
        run: |
          # 오너 ID
          OWNER_RESP=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/owners)
          echo "Owner response: $OWNER_RESP"
          OWNER_ID=$(echo "$OWNER_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d[0]['owner']['id'])")
          echo "OWNER_ID=$OWNER_ID" >> $GITHUB_ENV

          # 기존 웹 서비스 확인 — 응답: [{cursor, service:{id,name,...}}, ...]
          SERVICES=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?ownerId=$OWNER_ID&limit=50")
          echo "Services response: $SERVICES"
          WEB_ID=$(echo "$SERVICES" | python3 -c \
            "import sys,json; s=json.load(sys.stdin); \
             r=[x['service']['id'] for x in s if x.get('service',{}).get('name','')=='kkutu']; \
             print(r[0] if r else '')" 2>/dev/null || echo "")
          echo "WEB_ID=$WEB_ID" >> $GITHUB_ENV

          # PostgreSQL DB 확인 — 응답: [{cursor, postgres:{id,name,...}}, ...]
          DBS=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres?ownerId=$OWNER_ID&limit=50" || echo "[]")
          echo "Postgres response: $DBS"
          DB_ID=$(echo "$DBS" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); \
             r=[x['postgres']['id'] for x in d if x.get('postgres',{}).get('name','')=='kkutu-db']; \
             print(r[0] if r else '')" 2>/dev/null || echo "")
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          echo "WEB_ID=$WEB_ID  DB_ID=$DB_ID"

      - name: Create PostgreSQL database (if not exists)
        if: env.DB_ID == ''
        run: |
          echo "Creating PostgreSQL database..."
          DB_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"databaseName\": \"kkutu\",
              \"name\": \"kkutu-db\",
              \"ownerId\": \"$OWNER_ID\",
              \"plan\": \"free\",
              \"region\": \"oregon\",
              \"user\": \"kkutu\",
              \"version\": \"16\"
            }" \
            https://api.render.com/v1/postgres)
          echo "DB Response: $DB_RESP"
          # POST 응답: {postgres:{id,...}} 또는 {id,...} 형태 모두 처리
          NEW_DB_ID=$(echo "$DB_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); \
             print(d['postgres']['id'] if 'postgres' in d else d['id'])")
          if [ -z "$NEW_DB_ID" ]; then
            echo "ERROR: could not parse DB id from response"
            exit 1
          fi
          echo "DB_ID=$NEW_DB_ID" >> $GITHUB_ENV

          # DB가 available 될 때까지 대기
          for i in $(seq 1 30); do
            DB_STATUS_RESP=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/postgres/$NEW_DB_ID" || echo "{}")
            STATUS=$(echo "$DB_STATUS_RESP" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); \
               pg=d.get('postgres', d); print(pg.get('status',''))" 2>/dev/null || echo "")
            echo "[$i] DB status: $STATUS"
            if [ "$STATUS" = "available" ]; then break; fi
            sleep 10
          done

      - name: Get database connection string
        run: |
          DB_INFO=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres/$DB_ID")
          echo "DB info keys: $(echo "$DB_INFO" | python3 -c "import sys,json; print(list(json.load(sys.stdin).keys()))" 2>/dev/null)"
          # GET /postgres/:id 응답: {postgres:{connectionInfo:{externalConnectionString,...},...}}
          DB_URL=$(echo "$DB_INFO" | python3 -c "
import sys, json
d = json.load(sys.stdin)
pg = d.get('postgres', d)
ci = pg.get('connectionInfo', {})
url = (ci.get('externalConnectionString') or
       ci.get('externalUrl') or
       pg.get('databaseUrl') or
       pg.get('connectionString') or '')
print(url)
" 2>/dev/null || echo "")
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
          echo "DB URL length: ${#DB_URL}"
          if [ -z "$DB_URL" ]; then
            echo "WARNING: DB URL is empty — service will use SQLite fallback"
          fi

      - name: Create web service (if not exists)
        if: env.WEB_ID == ''
        run: |
          echo "Creating web service..."

          PAYLOAD=$(python3 -c "
import json, os, secrets
payload = {
  'type': 'web_service',
  'name': 'kkutu',
  'ownerId': os.environ['OWNER_ID'],
  'repo': 'https://github.com/${{ github.repository }}',
  'branch': '${{ github.ref_name }}',
  'autoDeploy': 'yes',
  'serviceDetails': {
    'env': 'node',
    'plan': 'free',
    'region': 'oregon',
    'buildCommand': 'cd Server/lib && npm install && npx grunt',
    'startCommand': 'node Server/lib/Web/main.js',
    'healthCheckPath': '/health'
  },
  'envVars': [
    {'key': 'NODE_ENV', 'value': 'production'},
    {'key': 'UNIFIED_GAME', 'value': 'true'},
    {'key': 'SESSION_SECRET', 'value': secrets.token_hex(32)},
    {'key': 'DATABASE_URL', 'value': os.environ.get('DATABASE_URL', '')},
    {'key': 'IS_PUBLIC', 'value': 'true'}
  ]
}
print(json.dumps(payload))
")
          echo "Payload (redacted secrets): $(echo "$PAYLOAD" | python3 -c "import sys,json; p=json.load(sys.stdin); [e.update({'value':'***'}) for e in p.get('envVars',[]) if e['key'] in ('SESSION_SECRET','DATABASE_URL')]; print(json.dumps(p, indent=2))")"

          WEB_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://api.render.com/v1/services)
          echo "Web service response: $WEB_RESP"

          NEW_WEB_ID=$(echo "$WEB_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['service']['id'])" 2>/dev/null || echo "")
          if [ -z "$NEW_WEB_ID" ]; then
            echo "ERROR: Failed to create web service — see response above"
            exit 1
          fi
          echo "WEB_ID=$NEW_WEB_ID" >> $GITHUB_ENV
          echo "Created web service: $NEW_WEB_ID"

      - name: Trigger redeploy (existing service)
        if: env.WEB_ID != ''
        run: |
          echo "Redeploying service $WEB_ID ..."
          REDEPLOY_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$WEB_ID/deploys")
          echo "Redeploy response: $REDEPLOY_RESP"

      - name: Print service URL
        run: |
          for i in $(seq 1 12); do
            INFO=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$WEB_ID" 2>/dev/null || echo "{}")
            URL=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); \
               svc=d.get('service',d); \
               print(svc.get('serviceDetails',{}).get('url',''))" 2>/dev/null || echo "")
            if [ -n "$URL" ]; then
              echo ""
              echo "✅ 배포 완료!"
              echo "🌐 URL: https://$URL"
              break
            fi
            echo "[$i] 서비스 URL 대기 중..."
            sleep 15
          done
