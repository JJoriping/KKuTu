name: Deploy to Render

on:
  push:
    branches: [main, master, claude/vercel-hosting-setup-fhVYR]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Deploy to Render (Blueprint)
        id: deploy
        run: |
          # 1. 오너 ID 가져오기
          if [ -z "$RENDER_OWNER_ID" ]; then
            OWNER_RESP=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              https://api.render.com/v1/owners)
            OWNER_ID=$(echo "$OWNER_RESP" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d[0]['owner']['id'])")
            echo "OWNER_ID=$OWNER_ID" >> $GITHUB_ENV
          else
            OWNER_ID="$RENDER_OWNER_ID"
            echo "OWNER_ID=$OWNER_ID" >> $GITHUB_ENV
          fi
          echo "Owner ID: $OWNER_ID"

          # 2. 기존 서비스 목록 확인
          SERVICES=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?ownerId=$OWNER_ID&limit=20")
          echo "Services: $SERVICES"

          WEB_ID=$(echo "$SERVICES" | python3 -c \
            "import sys,json; svcs=json.load(sys.stdin); \
             found=[s['service']['id'] for s in svcs if s['service']['name']=='kkutu']; \
             print(found[0] if found else '')" 2>/dev/null || echo "")

          DB_ID=$(echo "$SERVICES" | python3 -c \
            "import sys,json; svcs=json.load(sys.stdin); \
             found=[s['service']['id'] for s in svcs if s['service']['name']=='kkutu-db']; \
             print(found[0] if found else '')" 2>/dev/null || echo "")

          echo "WEB_ID=$WEB_ID" >> $GITHUB_ENV
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Create PostgreSQL database (if not exists)
        if: env.DB_ID == ''
        run: |
          echo "Creating PostgreSQL database..."
          DB_RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"databaseName\": \"kkutu\",
              \"name\": \"kkutu-db\",
              \"ownerId\": \"$OWNER_ID\",
              \"plan\": \"free\",
              \"region\": \"singapore\",
              \"user\": \"kkutu\",
              \"version\": \"16\"
            }" \
            https://api.render.com/v1/postgres)
          echo "DB Response: $DB_RESP"
          NEW_DB_ID=$(echo "$DB_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['id'])")
          echo "DB_ID=$NEW_DB_ID" >> $GITHUB_ENV
          echo "Created DB: $NEW_DB_ID"
          # DB가 준비될 때까지 대기
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/postgres/$NEW_DB_ID" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null)
            echo "DB status: $STATUS"
            if [ "$STATUS" = "available" ]; then break; fi
            sleep 10
          done

      - name: Get database connection string
        run: |
          DB_INFO=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres/$DB_ID")
          DB_URL=$(echo "$DB_INFO" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); \
             print(d.get('connectionInfo',{}).get('externalConnectionString',''))" 2>/dev/null || echo "")
          if [ -z "$DB_URL" ]; then
            DB_URL=$(echo "$DB_INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('databaseUrl',''))" 2>/dev/null || echo "")
          fi
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
          echo "Got DB URL (masked): ${DB_URL:0:30}..."

      - name: Create web service (if not exists)
        if: env.WEB_ID == ''
        run: |
          echo "Creating web service..."
          SESSION_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          WEB_RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"web_service\",
              \"name\": \"kkutu\",
              \"ownerId\": \"$OWNER_ID\",
              \"plan\": \"free\",
              \"region\": \"singapore\",
              \"repo\": \"https://github.com/${{ github.repository }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"buildCommand\": \"cd Server/lib && npm install && npx grunt\",
              \"startCommand\": \"node Server/lib/Web/main.js\",
              \"healthCheckPath\": \"/health\",
              \"autoDeploy\": \"yes\",
              \"envVars\": [
                {\"key\": \"NODE_ENV\", \"value\": \"production\"},
                {\"key\": \"UNIFIED_GAME\", \"value\": \"true\"},
                {\"key\": \"SESSION_SECRET\", \"value\": \"$SESSION_SECRET\"},
                {\"key\": \"DATABASE_URL\", \"value\": \"$DATABASE_URL\"},
                {\"key\": \"IS_PUBLIC\", \"value\": \"true\"}
              ]
            }" \
            https://api.render.com/v1/services)
          echo "Web Response: $WEB_RESP"
          NEW_WEB_ID=$(echo "$WEB_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['service']['id'])")
          echo "WEB_ID=$NEW_WEB_ID" >> $GITHUB_ENV
          echo "Created web service: $NEW_WEB_ID"

      - name: Trigger deploy (existing service)
        if: env.WEB_ID != ''
        run: |
          echo "Triggering redeploy for service $WEB_ID..."
          DEPLOY_RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\": \"do_not_clear\"}" \
            "https://api.render.com/v1/services/$WEB_ID/deploys")
          echo "Deploy response: $DEPLOY_RESP"
          DEPLOY_ID=$(echo "$DEPLOY_RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['id'])" 2>/dev/null || echo "")
          echo "Deploy ID: $DEPLOY_ID"

      - name: Wait for deploy and print URL
        run: |
          echo "Waiting for service to be live..."
          for i in $(seq 1 20); do
            INFO=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$WEB_ID")
            STATUS=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d['service'].get('suspended',''))" 2>/dev/null)
            URL=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d['service'].get('serviceDetails',{}).get('url',''))" 2>/dev/null)
            echo "Status: $STATUS | URL: $URL"
            if [ -n "$URL" ]; then
              echo ""
              echo "✅ 배포 완료!"
              echo "🌐 URL: $URL"
              break
            fi
            sleep 15
          done
